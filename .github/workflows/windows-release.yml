name: Windows desktop release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt
      - name: Run offline smoke tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke.py
      - name: Build EcoPulse.exe
        shell: cmd
        run: build_windows.bat
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoPulse-Windows
          path: dist/EcoPulse.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: validate-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged executable
        uses: actions/download-artifact@v4
        with:
          name: EcoPulse-Windows
          path: release
      - name: Create or update release and attach executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "release/EcoPulse.exe" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "release/EcoPulse.exe" --repo $env:GITHUB_REPOSITORY --title "EcoPulse $tag" --generate-notes
          }
